name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.release-check.outputs.published }}
      version: ${{ steps.release-check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # semantic-release tags the released commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          git fetch --tags --force
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [ -n "$tag" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "Released $tag"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No new release"
          fi

  # Mirror of the npm release. A separate job so a failure here never affects npm, which has
  # already published by the time this runs.
  github-packages:
    name: Publish to GitHub Packages
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The release tag carries the package.json bumped to the released version.
          ref: v${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@eljijuna"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Only in this job: GitHub Packages requires the owner's scope and has no provenance.
      - name: Scope the package for GitHub Packages
        run: |
          npm pkg set name=@eljijuna/code-languages
          npm pkg delete publishConfig.provenance

      # Tests already ran in the release job; skip lifecycle scripts.
      - name: Publish
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
