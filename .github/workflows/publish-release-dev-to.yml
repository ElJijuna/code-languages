name: Publish release post to DEV

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-devto:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Read latest GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          if ! RELEASE_JSON=$(gh release view --repo "$GH_REPO" --json tagName,url,body,publishedAt 2>/dev/null); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No GitHub release was found for $GH_REPO."
            exit 0
          fi

          TAG_NAME=$(jq -r '.tagName // empty' <<< "$RELEASE_JSON")
          if [ -z "$TAG_NAME" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Latest GitHub release has no tag name."
            exit 0
          fi

          TAG_REF_JSON=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG_NAME")
          TAG_OBJECT_TYPE=$(jq -r '.object.type' <<< "$TAG_REF_JSON")
          TAG_OBJECT_SHA=$(jq -r '.object.sha' <<< "$TAG_REF_JSON")

          if [ "$TAG_OBJECT_TYPE" = "tag" ]; then
            TAG_OBJECT_SHA=$(gh api "repos/$GH_REPO/git/tags/$TAG_OBJECT_SHA" --jq '.object.sha')
          fi

          if [ -n "$RELEASE_HEAD_SHA" ]; then
            if [ "$TAG_OBJECT_SHA" != "$RELEASE_HEAD_SHA" ]; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "Latest release $TAG_NAME points to $TAG_OBJECT_SHA, not this Release workflow SHA $RELEASE_HEAD_SHA."
              exit 0
            fi
          else
            echo "Manual run detected; publishing latest release $TAG_NAME."
          fi

          echo "Publishing DEV article for $TAG_NAME."

          {
            echo "found=true"
            echo "tag_name=$TAG_NAME"
            echo "url=$(jq -r '.url' <<< "$RELEASE_JSON")"
            echo "body<<RELEASE_BODY"
            jq -r '.body // ""' <<< "$RELEASE_JSON"
            echo "RELEASE_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Publish article to DEV
        if: steps.release.outputs.found == 'true'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ steps.release.outputs.tag_name }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
        run: |
          if [ -z "$DEVTO_API_KEY" ]; then
            echo "DEVTO_API_KEY secret is not configured."
            exit 1
          fi

          BODY=$(
            jq -n \
              --arg title "$PACKAGE_NAME $VERSION released" \
              --arg body "New version published: **$PACKAGE_NAME $VERSION**\n\nSee release: $RELEASE_URL\n\n## Changes\n\n$RELEASE_BODY" \
              '{
                article: {
                  title: $title,
                  published: true,
                  tags: "javascript, opensource, npm, programming",
                  body_markdown: $body
                }
              }'
          )

          curl --fail-with-body --show-error --silent -X POST "https://dev.to/api/articles" \
            -H "Accept: application/vnd.forem.api-v1+json" \
            -H "Content-Type: application/json" \
            -H "User-Agent: very-simple-icons-release-workflow" \
            -H "api-key: $DEVTO_API_KEY" \
            -d "$BODY"
