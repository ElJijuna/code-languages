name: Publish release post to DEV

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish-devto:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Read latest GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          if ! RELEASE_JSON=$(gh release view --repo "$GH_REPO" --json tagName,url,body,publishedAt 2>/dev/null); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No GitHub release was found for $GH_REPO."
            exit 0
          fi

          PUBLISHED_AT=$(jq -r '.publishedAt // empty' <<< "$RELEASE_JSON")
          if [ -z "$PUBLISHED_AT" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Latest GitHub release has no publishedAt timestamp."
            exit 0
          fi

          PUBLISHED_EPOCH=$(date -d "$PUBLISHED_AT" +%s)
          RUN_STARTED_EPOCH=$(date -d "$RUN_STARTED_AT" +%s)

          if [ "$PUBLISHED_EPOCH" -lt "$RUN_STARTED_EPOCH" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Latest release was published before this Release workflow run."
            exit 0
          fi

          echo "Publishing DEV article for $(jq -r '.tagName' <<< "$RELEASE_JSON")."

          {
            echo "found=true"
            echo "tag_name=$(jq -r '.tagName' <<< "$RELEASE_JSON")"
            echo "url=$(jq -r '.url' <<< "$RELEASE_JSON")"
            echo "body<<RELEASE_BODY"
            jq -r '.body // ""' <<< "$RELEASE_JSON"
            echo "RELEASE_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Publish article to DEV
        if: steps.release.outputs.found == 'true'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ steps.release.outputs.tag_name }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
        run: |
          if [ -z "$DEVTO_API_KEY" ]; then
            echo "DEVTO_API_KEY secret is not configured."
            exit 1
          fi

          BODY=$(
            jq -n \
              --arg title "$PACKAGE_NAME $VERSION released" \
              --arg body "New version published: **$PACKAGE_NAME $VERSION**\n\nSee release: $RELEASE_URL\n\n## Changes\n\n$RELEASE_BODY" \
              '{
                article: {
                  title: $title,
                  published: true,
                  tags: "javascript, opensource, npm, programming",
                  body_markdown: $body
                }
              }'
          )

          curl --fail-with-body --show-error --silent -X POST "https://dev.to/api/articles" \
            -H "Accept: application/vnd.forem.api-v1+json" \
            -H "Content-Type: application/json" \
            -H "User-Agent: very-simple-icons-release-workflow" \
            -H "api-key: $DEVTO_API_KEY" \
            -d "$BODY"
