name: Check Language Versions

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      create_pull_requests:
        description: Create or update pull requests for detected version updates
        required: false
        type: boolean
        default: false
      delay:
        description: Delay in seconds between version checks to avoid hitting API rate limits
        required: false
        type: number
        default: 3000

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-language-versions:
    name: Check language versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check language versions and create issues
        run: |
          args="--create-issues"
          create_pull_requests="${{ inputs.create_pull_requests }}"
          delay="${{ inputs.delay }}"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            create_pull_requests="true"
          fi

          if [ -z "$delay" ]; then
            delay="3000"
          fi

          if [ "$create_pull_requests" = "true" ]; then
            args="$args --create-pull-requests"
          fi

          if [ "$delay" -gt 0 ]; then
            args="$args --delay $delay"
          fi

          node scripts/check-language-versions.mjs $args
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload version report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-version-report
          path: language-version-report.json
